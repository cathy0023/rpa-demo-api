# =============================================================================
# wecom.nonoai.com.cn nginx 虚拟主机配置
# 目标服务器: 47.89.150.106 (阿里云 ECS, nginx/1.20.1)
#
# 本文件为「完整版」(80 + 443), 供参考与回滚对照。
# 实际部署由 deploy/setup-server.sh 分两阶段完成:
#   阶段 1: 先写入下方「80-only 版本」(仅 ACME 验证 + 301), 用于 certbot 签发证书
#   阶段 2: 证书签发成功后, 用本文件完整内容覆盖同一路径并 reload
#
# 放置路径: /etc/nginx/conf.d/wecom.nonoai.com.cn.conf
# =============================================================================

# -----------------------------------------------------------------------------
# 80 端口: ACME http-01 验证 + 全量 301 跳转 https
# (setup-server.sh 阶段 1 会先部署仅含本 server 块的版本)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name wecom.nonoai.com.cn;

    # certbot webroot 模式: Let's Encrypt 通过 http://wecom.nonoai.com.cn/.well-known/acme-challenge/<token>
    # 完成域名所有权验证, 该路径必须直出文件系统、不做 301
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余所有 HTTP 请求永久跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 443 端口: TLS 终止 + 反向代理到本机 FastAPI(uvicorn, 127.0.0.1:8000)
# 证书由 certbot 签发至 /etc/letsencrypt/live/wecom.nonoai.com.cn/
# -----------------------------------------------------------------------------
server {
    # nginx 1.20.1 兼容说明:
    #   - `http2 on;` 指令是 nginx 1.25.1+ 的新语法, 1.20 不认识, 会直接报错
    #   - 因此这里使用旧语法 `listen 443 ssl http2;`
    #   - 若未来升级 nginx >= 1.25.1, 请改为:
    #       listen 443 ssl;
    #       http2 on;
    listen 443 ssl http2;
    server_name wecom.nonoai.com.cn;

    # Let's Encrypt 证书 (certbot webroot 模式签发)
    ssl_certificate     /etc/letsencrypt/live/wecom.nonoai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wecom.nonoai.com.cn/privkey.pem;

    # TLS 协议与套件 (兼容企微内置 WebView / 移动端)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传体积上限 (企微侧边栏不会传大文件, 10m 足够)
    client_max_body_size 10m;

    # ---- 反向代理到 FastAPI ------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;

        # 透传真实主机名与客户端信息, FastAPI 侧据此生成正确的回调 URL
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 以支持 keep-alive 与 SSE 流式响应
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键: RPA 执行过程通过 SSE 增量推送, 必须关闭缓冲,
        # 否则 nginx 会攒满缓冲区才转发, 前端表现为"卡住不出进度"
        proxy_buffering off;

        # RPA 任务可能长时间执行 (LLM 多轮调用), 放宽读超时到 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
